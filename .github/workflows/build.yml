name: Build Mawaid APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install FFmpeg & Generate Silent Audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p assets
          ffmpeg -f lavfi -i anullsrc=r=44100:cl=mono -t 1 -q:a 9 -acodec libmp3lame -y assets/silent.mp3
          ls -la assets/

      - name: Configure Android Gradle, Permissions & Flutter v2 Embedding
        run: |
          # 1. Ensure android directory exists
          if [ ! -d "android/app/src/main" ]; then
            echo "Creating Flutter android skeleton..."
            flutter create --org com.yousef --project-name mawaid .
          fi

          # 2. Configure android/settings.gradle, android/build.gradle and gradle-wrapper.properties
          python3 -c '
          import os

          settings_gradle = """pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }

          include ":app"
          """
          with open("android/settings.gradle", "w") as f:
              f.write(settings_gradle)

          build_gradle = """allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          subprojects {
              project.configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.9.22"
                      }
                  }
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          """
          with open("android/build.gradle", "w") as f:
              f.write(build_gradle)

          wrapper_props = """distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          """
          os.makedirs("android/gradle/wrapper", exist_ok=True)
          with open("android/gradle/wrapper/gradle-wrapper.properties", "w") as f:
              lines = [line.strip() for line in wrapper_props.strip().splitlines()]
              f.write("\n".join(lines) + "\n")
          '

          # 3. Configure android/app/build.gradle versions & Java 17
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle || true

          # 4. Enforce Flutter v2 Embedding in AndroidManifest.xml and MainActivity
          python3 -c '
          import os, glob

          # Clean legacy MainActivity
          main_kt = "android/app/src/main/kotlin/com/yousef/mawaid/MainActivity.kt"
          os.makedirs(os.path.dirname(main_kt), exist_ok=True)
          with open(main_kt, "w") as f:
              f.write("""package com.yousef.mawaid

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          """.replace("          ", ""))

          # Remove legacy java files extending old FlutterActivity
          for java_file in glob.glob("android/app/src/main/**/MainActivity.java", recursive=True):
              try:
                  os.remove(java_file)
              except Exception:
                  pass

          # Ensure AndroidManifest has flutterEmbedding meta-data
          manifest_file = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_file):
              with open(manifest_file, "r") as f:
                  m_content = f.read()

              # Replace legacy FlutterApplication if present
              m_content = m_content.replace("io.flutter.app.FlutterApplication", "${applicationName}")

              if "flutterEmbedding" not in m_content:
                  v2_meta = "\n        <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />\n"
                  if "<application" in m_content:
                      parts = m_content.split("<application", 1)
                      rest_parts = parts[1].split(">", 1)
                      m_content = parts[0] + "<application" + rest_parts[0] + ">" + v2_meta + rest_parts[1]
              with open(manifest_file, "w") as f:
                  f.write(m_content)
          '

          # 5. Inject Required Permissions into AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            PERMISSIONS='
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
            '
            echo "$PERMISSIONS" > /tmp/permissions.txt
            sed -i '/<application/e cat /tmp/permissions.txt' "$MANIFEST_FILE" || true
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawaid-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
